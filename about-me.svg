<svg width="1180" height="400" viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    
    <filter id="glowText" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1180" height="400" rx="20" fill="#0A0A0A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Glow Effects -->
  <circle cx="200" cy="200" r="180" fill="#FFFFFF" fill-opacity="0.04" filter="url(#softBlur)"/>
  <circle cx="900" cy="200" r="180" fill="#FFFFFF" fill-opacity="0.03" filter="url(#softBlur)"/>

  <!-- Title -->
  <text x="590" y="45" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="24" font-weight="700" fill="url(#abtGrad)" letter-spacing="3">✦ 𝐀𝐛𝐨𝐮𝐭 𝐌𝐞 &amp; 𝐖𝐡𝐚𝐭 𝐃𝐫𝐢𝐯𝐞𝐬 𝐌𝐞 ✦</text>
  
  <line x1="200" y1="60" x2="980" y2="60" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ========== LEFT SIDE - IMAGE ========== -->
  <g>
    <!-- Profile Image Placeholder -->
    <rect x="50" y="85" width="220" height="270" rx="16" fill="#1A1A1A" stroke="url(#borderGrad2)" stroke-width="1.5"/>
    
    <!-- Image Box -->
    <rect x="60" y="95" width="200" height="200" rx="12" fill="#2A2A2A"/>
    
    <!-- Avatar / Initials -->
    <text x="160" y="220" text-anchor="middle" font-family="'Georgia', serif" font-size="72" font-weight="700" fill="url(#abtGrad)">DU</text>
    
    <!-- Image Border Glow -->
    <rect x="60" y="95" width="200" height="200" rx="12" fill="none" stroke="url(#borderGrad2)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Profile Name -->
    <text x="160" y="315" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Divyang Upreti</text>
    <text x="160" y="338" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="13" fill="#94A3B8" font-style="italic">AI/ML &amp; Software Developer</text>
  </g>

  <!-- ========== RIGHT SIDE - TEXT ========== -->
  <g>
    <!-- Heading -->
    <text x="310" y="110" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="700" fill="url(#abtGrad)" filter="url(#glowText)">👨🏻‍💻 𝐖𝐡𝐨 𝐈 𝐀𝐦</text>
    
    <!-- Description Paragraph -->
    <text x="310" y="150" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14.5" fill="#D1D5DB">
      <tspan x="310" dy="0">I'm a passionate developer who loves crafting intelligent</tspan>
      <tspan x="310" dy="24">systems that solve real-world problems. With a strong</tspan>
      <tspan x="310" dy="24">foundation in AI/ML and full-stack development, I bridge</tspan>
      <tspan x="310" dy="24">the gap between cutting-edge research and practical,</tspan>
      <tspan x="310" dy="24">impactful applications.</tspan>
    </text>

    <!-- Divider -->
    <line x1="310" y1="255" x2="1100" y2="255" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- What Drives Me - Heading -->
    <text x="310" y="285" font-family="'Georgia', 'Times New Roman', serif" font-size="18" font-weight="700" fill="url(#abtGrad)" filter="url(#glowText)">⚡ 𝐖𝐡𝐚𝐭 𝐃𝐫𝐢𝐯𝐞𝐬 𝐌𝐞</text>

    <!-- What Drives Me - Text -->
    <text x="310" y="318" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" fill="#D1D5DB">
      <tspan x="310" dy="0">✦ Building AI-powered solutions that make a difference</tspan>
      <tspan x="310" dy="22">✦ Writing clean, elegant, and maintainable code</tspan>
      <tspan x="310" dy="22">✦ Learning and adapting to new technologies</tspan>
      <tspan x="310" dy="22">✦ Creating seamless user experiences</tspan>
    </text>
  </g>

  <!-- Bottom Border Glow -->
  <rect x="0" y="0" width="1180" height="400" rx="20" fill="none" stroke="url(#borderGrad2)" stroke-width="1.5" opacity="0.6"/>
</svg>
